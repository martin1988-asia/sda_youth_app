name: sda_youth_app
description: "SDA Youth App with Firebase Authentication"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 🔥 Firebase
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1
  firebase_storage: ^13.4.1
  firebase_crashlytics: ^5.2.2
  firebase_analytics: ^12.4.1

  # 📸 Media + Input
  image_picker: ^1.2.2
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5
  intl: ^0.20.2

  # 🎥 Video Core
  video_player: ^2.11.1
  visibility_detector: ^0.4.0+2
  video_thumbnail: ^0.5.6

  # 🎬 ADVANCED VIDEO ENGINE (REAL PROCESSING)
  ffmpeg_kit_flutter: ^6.0.3
  video_editor: ^2.4.0

  # 📂 FILE + IMAGE PROCESSING
  path_provider: ^2.1.3
  path: ^1.9.0
  image: ^4.2.0

  # ⚡ PERFORMANCE + CACHE
  flutter_cache_manager: ^3.3.1

  # 🎧 AUDIO (READY FOR OVERLAY & FUTURE FEATURES)
  audioplayers: ^5.2.1
  just_audio: ^0.9.38

  # 🧭 Routing
  go_router: ^17.2.3

  # 🔐 Auth
  google_sign_in: ^7.2.0

  # 🧠 UI + SYSTEM
  device_info_plus: ^11.3.0
  google_fonts: ^8.1.0

  # ⏱ Time
  timeago: ^3.6.0

  # ✍️ Editor
  flutter_quill: ^11.5.1

  # 🌐 Networking
  http: ^1.2.1

  # 📤 Sharing
  share_plus: ^12.0.2

  # 💾 STATE (SCALING — OPTIONAL BUT READY)
  riverpod: ^2.5.1
  rxdart: ^0.28.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.3


flutter:
  uses-material-design: true

  assets:
    - assets/background.jpg
    - assets/sda_logo.png

  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans.ttf
